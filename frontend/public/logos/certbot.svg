<svg width="24" height="24" viewBox="1 1.5 19 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Certbot</title>
  <!-- Red Key held up -->
  <circle cx="3.5" cy="4.8" r="2.1" stroke="#E31837" stroke-width="1.3" fill="none"/>
  <rect x="5.6" y="4.1" width="13.2" height="1.4" fill="#E31837" rx="0.5"/>
  <rect x="15" y="5.5" width="1.3" height="1.8" fill="#E31837" rx="0.3"/>
  <rect x="17.4" y="5.5" width="1.3" height="2.6" fill="#E31837" rx="0.3"/>
  <rect x="16.3" y="2.5" width="2.2" height="1.7" fill="#E31837" rx="0.3"/>

  <!-- Robot Arms (Red) -->
  <path d="M7 11.5L6.4 7.2L5.2 5.2" stroke="#E31837" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 11.5L15.6 7.2L16.8 5.2" stroke="#E31837" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Robot Head (White/Black) -->
  <path d="M8.2 9.8C8.2 7.2 9.6 5.8 11 5.8C12.4 5.8 13.8 7.2 13.8 9.8V11H8.2V9.8Z" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"/>
  <circle cx="9.6" cy="8.6" r="0.7" fill="#000000"/>
  <circle cx="12.4" cy="8.6" r="0.7" fill="#000000"/>

  <!-- Robot Body (Black with Red Keyhole) -->
  <rect x="7.2" y="10.8" width="7.6" height="7" rx="1.2" fill="#000000"/>
  <!-- Keyhole in body -->
  <circle cx="11" cy="13.2" r="1.1" fill="#E31837"/>
  <polygon points="10.4,13.8 11.6,13.8 11.9,16.2 10.1,16.2" fill="#E31837"/>

  <!-- Robot Legs / Treads (Red & Black) -->
  <rect x="7.8" y="17.6" width="2.2" height="2.6" fill="#E31837" rx="0.5"/>
  <rect x="12" y="17.6" width="2.2" height="2.6" fill="#E31837" rx="0.5"/>
  <rect x="6.8" y="20" width="4.4" height="1.5" rx="0.5" fill="#000000"/>
  <rect x="10.8" y="20" width="4.4" height="1.5" rx="0.5" fill="#000000"/>
</svg>
