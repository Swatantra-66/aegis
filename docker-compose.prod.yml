version: '3.8'

services:
  # ── PostgreSQL Database 
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iam_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iam_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # ── Redis Cache & Token Store 
  redis:
    image: redis:7-alpine
    container_name: aegis-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # ── Backend Node.js API 
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: ${APP_NAME:-IAM-Portal}
      APP_URL: ${APP_URL}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iam_portal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aegis-network

  # ── Frontend & Nginx Reverse Proxy 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aegis-network

  # ── Certbot Automated SSL Renewal 
  certbot:
    image: certbot/certbot:latest
    container_name: aegis-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - aegis-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  aegis-network:
    driver: bridge
